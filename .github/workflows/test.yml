name: BYV SDK checks

on:
  push:
    branches: [main, experiment/text-only-inference, feat/dsml-tool-call-mode, feat/e2e-token-streaming-phase-1-5]
  pull_request:
    branches: [main, feat/dsml-prompt-byv-adapter]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Keep parallel tests from racing to create the local development token file.
      GATEWAY_API_KEY: byv-ci-test-gateway-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
